name: Tier 1 — PR Entry Validation (Zero Secrets)

on:
  pull_request:
    paths:
      - 'data/plugins/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  lint-entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce PR file path & count guardrails
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module -e "
            import { execFileSync } from 'node:child_process';
            import { validatePrDiffLimits } from './scripts/validate-entries.mjs';
            const out = execFileSync('git', ['diff', '--name-status', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' });
            const addedOrModified = [];
            const deleted = [];
            for (const line of out.trim().split('\n').filter(Boolean)) {
              const [status, file] = line.split(/\t+/);
              if (status.startsWith('D')) deleted.push(file);
              else addedOrModified.push(file);
            }
            validatePrDiffLimits({ addedOrModified, deleted });
          "

      - name: Validate submission YAML schemas & run unit tests
        run: |
          node scripts/validate-entries.mjs
          node --test test/*.test.mjs
