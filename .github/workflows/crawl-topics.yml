name: Track 2 — Multi-Source & Aggregator Discovery Crawler (Every 6h)

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-state-publish
  cancel-in-progress: false

jobs:
  crawl-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Seed existing per-plugin READMEs from gh-pages
        run: |
          mkdir -p .tmp/gh-pages-seed/readmes
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git archive origin/gh-pages -- readmes 2>/dev/null | tar -x -C .tmp/gh-pages-seed || true
          fi

      - name: Crawl multi-source GitHub topics, code signals & aggregators and rebuild catalog
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_CRAWLER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/crawl-topics.mjs --seed-readmes-dir=.tmp/gh-pages-seed/readmes --out-readmes-dir=dist/readmes
          node scripts/build-catalog.mjs --seed-readmes-dir=.tmp/gh-pages-seed/readmes --gc-icons

      - name: Commit updated Track-2 state & sanitized icons to main (with rebase retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(crawl): update Track-2 multi-source cache, negative cache and icons"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push state updates to main after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Publish dist/* to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .tmp/gh-pages
          cp -r dist/* .tmp/gh-pages/
          touch .tmp/gh-pages/.nojekyll
          cd .tmp/gh-pages
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(catalog): publish Track-2 unverified-index, lazy readmes, and icons"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
