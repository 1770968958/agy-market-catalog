name: Sync Releases & Dual Mirror Publish (Every 30m)

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'data/plugins/**'
      - 'state/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Poll GitHub Releases & build static catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-releases.mjs
          node scripts/build-catalog.mjs

      - name: Commit updated lock/ledger state to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): update versions-lock and ledger"
            git push origin HEAD:main
          fi

      - name: Publish dist/* to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .tmp/gh-pages
          cp -r dist/* .tmp/gh-pages/
          touch .tmp/gh-pages/.nojekyll
          cd .tmp/gh-pages
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(catalog): publish compiled catalog artifacts"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Publish @agy-market/catalog to npm via OIDC on content change
        if: ${{ env.NPM_PUBLISH_ENABLED == 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-catalog-npm.mjs
